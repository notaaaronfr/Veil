# Veil on a VM: Caddy (TLS) -> Veil (gunicorn) ; daily ledger maintenance.
#   cp veil.example.yaml /etc/veil/veil.yaml && edit
#   put secrets in /etc/veil/secrets/ (0400, owned by uid 10001) and TLS files in /etc/veil/tls/
#   docker compose up -d
name: veil

x-veil: &veil
  image: ${VEIL_IMAGE:-veil:0.4.0}
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=256m,mode=1777"]
  environment:
    VEIL_CONFIG: /etc/veil/veil.yaml
    VEIL_WORKERS: ${VEIL_WORKERS:-2}
    VEIL_MAX_REQUESTS: ${VEIL_MAX_REQUESTS:-2000}
    VEIL_LOG_FORMAT: json
  volumes:
    - /etc/veil:/etc/veil:ro
    - veil-ledger:/var/lib/veil/ledger
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "50m", max-file: "10"}

services:
  veil:
    <<: *veil
    mem_limit: ${VEIL_MEMORY:-8g}         # reload (SIGHUP) briefly runs old + new workers: size for 2 x workers
    memswap_limit: ${VEIL_MEMORY:-8g}     # = mem_limit: the container may not use swap
    ulimits:
      core: 0
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  caddy:
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports: ["443:443"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/data", "/config"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/veil/tls:/etc/caddy/tls:ro
    networks: [internal, edge]
    depends_on:
      veil: {condition: service_healthy}
    restart: unless-stopped

  maintenance:
    <<: *veil
    # verify every tenant's chain, then apply retention (legal holds are respected)
    entrypoint: ["sh", "-c", "while true; do veil-admin ledger verify -c /etc/veil/veil.yaml; veil-admin ledger prune -c /etc/veil/veil.yaml; sleep 86400; done"]
    networks: [internal]
    mem_limit: 512m
    healthcheck: {disable: true}   # the image's check probes the proxy port, which this job doesn't serve

volumes:
  veil-ledger: {}

networks:
  edge: {}                         # clients -> Caddy
  internal: {internal: true}       # Caddy <-> Veil, no route out
  egress: {}                       # Veil -> approved upstreams only (enforce with nftables.conf)

# Egress allowlist for the Veil host (nftables). Veil's own allowlist refuses unapproved
# deployments; this makes the network enforce the same rule underneath it.
# Replace the sets with the resolved addresses of your approved endpoints, e.g.
#   dig +short <resource>.openai.azure.com        (Azure OpenAI, UAE North)
#   dig +short login.microsoftonline.com          (only if Entra ID tokens are used)
# Load: nft -f /etc/veil/nftables.conf   (and enable the nftables service)

table inet veil_egress {
	set approved_v4 {
		type ipv4_addr
		flags interval
		elements = { 203.0.113.10, 203.0.113.11 }   # <-- approved upstream / Entra addresses
	}

	chain forward {
		type filter hook forward priority 0; policy accept;
		# traffic leaving the Docker bridge networks
		iifname "br-*" oifname != "br-*" ct state established,related accept
		iifname "br-*" oifname != "br-*" ip daddr @approved_v4 tcp dport 443 accept
		iifname "br-*" oifname != "br-*" udp dport 53 accept   # DNS; restrict to your resolvers
		iifname "br-*" oifname != "br-*" log prefix "veil-egress-drop " drop
	}
}

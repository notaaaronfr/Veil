[project]
name = "sandwich"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "notaaaronfr", email = "charlesaarondavid@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "gliner>=0.2.29",
    "mlx-lm>=0.32.2",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.362",
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "transformers>=5.16.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datasets>=5.1.0",
    "pytest>=9.1.1",
    "sacrebleu>=2.6.0",
]

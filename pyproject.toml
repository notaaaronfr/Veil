[project]
name = "veil"
version = "0.4.0"
description = "Verified pseudonymisation proxy for LLM calls"
readme = "README.md"
authors = [
    { name = "notaaaronfr", email = "charlesaarondavid@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
proxy = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "httpx>=0.28",
    "gunicorn>=23.0",
    "uvicorn-worker>=0.3",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0.3",
]
ner = [
    "gliner>=0.2.29",
    "torch>=2.14.1",
    "transformers>=5.16.1",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.14.0",
    "protobuf>=7.36.2",
]
# local LLM for the context guard; MLX is Apple Silicon only
context = ["mlx-lm>=0.32.2"]

[project.scripts]
veil-proxy = "veil.proxy:main"
veil-admin = "veil.admin:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datasets>=5.1.0",
    "pytest>=9.1.1",
    "sacrebleu>=2.6.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.362",
    "openai>=3.35.1",
]

# CPU-only torch on Linux (the branch servers); macOS keeps the PyPI build (MPS).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
